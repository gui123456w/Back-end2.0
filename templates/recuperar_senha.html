{% extends "base.html" %}

{% block title %}Recuperar {% endblock %}

{% block content %}

<h1>Recuperar senha</h1>

<p>
    Informe o e-mail cadastrado em sua conta.
    Enviaremos um link para você redefinir sua senha.
</p>

<form method="POST">

{% if form %}
    {{ form.hidden_tag() }}
{% endif %}

<label for="email">E-mail</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="Digite seu e-mail"
    required
    autocomplete="email"
>

<button type="submit">
    Enviar link de recuperação
</button>

</form>

<div class="links">
    <a href="{{ url_for('main.login') }}">
        Voltar para o login
    </a>
</div>

{% endblock %}
