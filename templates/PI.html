<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Sustenta+</title>
    <link rel="stylesheet" href="/app_corrigido/app_fixed/css/pi.css">
    <link rel="stylesheet" href="/app_corrigido/app_fixed/css/card.css">
    <link rel="stylesheet" href="/app_corrigido/app_fixed/css/responsivo.css">
    <link rel="stylesheet" href="/app_corrigido/app_fixed/templates/css/hero.css">
    <link rel="stylesheet" href="/app_corrigido/app_fixed/templates/css/button.css">
</head>

<body>
    <!-- HERO -->
    <section class="hero">

        <nav class="menu">
            <div class="menu-links">
                <a href="/app_corrigido/app_fixed/templates/PI.html">Início</a>
                <a href="/app_corrigido/app_fixed/templates/Dicas.html">Dicas Sustentáveis</a>
                <a href="/app_corrigido/app_fixed/templates/Coleta.html">Pontos de Coletas</a>
                <a href="/app_corrigido/app_fixed/templates/Loguin.html">Login</a>
            </div>
        </nav>

        <div class="container hero-content">

            <div class="hero-text">
                <h1 class="title">Sustenta+</h1>
                <h3 class="subtitle">Transformando resíduos em novas oportunidades para um futuro sustentável!</h3>
                <!-- <h4><p>Sustenta+ e um site que vai ensinar você, sua familia e seus colegas a sobre os lixos que vemos na rua! cada cor representa uma tipo de descarte diferente e aqui voce vai descobrir cada um deles.</p></h4> -->
            </div>

            <div class="hero-img">
                <img src="/app_corrigido/app_fixed/img/Reciclavel (1).png">
            </div>

        </div>
    </section>

    <div class="parte1">
        <!-- CARDS -->
        <section class="section">
            <div class="container cards">

                <div class="card card-green">
                        <h3>Vidro</h3>
                        <img src="/app_corrigido/app_fixed/img/LixoVerde.png">

                    <button class="btn-card" data-tipo="vidro" onclick="montarConteudo()">Saiba Mais</button>

                </div>

                <div class="card card-blue">
                    <h3>Papel e papelão</h3>
                    <img src="/app_corrigido/app_fixed/img/lixoAzul.png">

                    <button class="btn-card" data-tipo="papel">Saiba Mais</button>

                </div>

                <div class="card card-red">
                    <h3>Plastico e isopor</h3>
                    <img src="/app_corrigido/app_fixed/templates/img/lixoVermelho.png">

                    <button class="btn-card" data-tipo="plastico">Saiba Mais</button>

                </div>

                <div class="card card-brown">
                    <h3>Organico</h3>
                    <img src="/app_corrigido/app_fixed/img/lixoMarrom.png">

                    <button class="btn-card" data-tipo="organico">Saiba Mais</button>

                </div>

                <div class="card card-orange">
                    <h3>Metal</h3>
                    <img src="/app_corrigido/app_fixed/img/lixolaranja.png">

                    <button class="btn-card" data-tipo="metal">Saiba Mais</button>

                </div>

                <div class="card card-white">
                    <h3>Saude</h3>
                    <img src="/app_corrigido/app_fixed/templates/img/lixoBranco.png">

                    <button class="btn-card" data-tipo="saude">Saiba Mais</button>

                </div>

                <div class="card card-purple">
                    <h3>Radioativo</h3>
                    <img src="/app_corrigido/app_fixed/img/lixoRoxo.png">

                    <button class="btn-card" data-tipo="radioativo">Saiba Mais</button>

                </div>

                <div class="card card-grey">
                    <h3>Misturado</h3>
                    <img src="/app_corrigido/app_fixed/img/lixoCinza.png">

                    <button class="btn-card" data-tipo="misturado">Saiba Mais</button>

                </div>

            </div>
        </section>

        <!-- MODAL DO JS -->
        <div id="modal" class="modal">
            <div class="modal-overlay"></div>

            <div class="modal-box">
                <div class="modal-header">
                    <h2 id="modalTitle"></h2>
                    <span id="closeModal">&times;</span>
                </div>

                <div class="modal-body" id="modalContent"></div>
            </div>
        </div>
    </div>
    <script src="/app_corrigido/app_fixed/js/PI.js"></script>
</body>

</html>
