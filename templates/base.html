<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RecicladDB{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            width: 320px;
        }
        input {
            display: block;
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 0.6rem;
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #256428;
        }
        .erro {
            color: #b00020;
            margin-bottom: 1rem;
        }
        .links {
            margin-top: 1rem;
            text-align: center;
            color: black;
        }
    </style>
</head>

<body>
    <div class="card">
        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <div class="erro">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>

</html>
