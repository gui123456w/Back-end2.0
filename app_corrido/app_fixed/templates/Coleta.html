<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pontos de Coleta - Green Living</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/pi.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Coleta.css') }}">

</head>

<body>

 <nav class="menu">
        <div class="menu-links">
            <a href="{{ url_for('main.pi') }}">Início</a>
            <a href="{{ url_for('main.dicas') }}">Dicas Sustentáveis</a>
            <a href="{{ url_for('main.coleta') }}">Pontos de Coletas</a>
            <a href="{{ url_for('main.loguin') }}">Loguin</a>
        </div>
    </nav>

    <section class="hero-custom">

        <div class="hero-body">

            <h1 class="titulo-principal">
                Pontos de Coleta
            </h1>

            <div class="container">

                <div class="texto">

                    <form id="form-busca" class="formulario-busca">

                        <div class="campo-busca">

                            <label for="material">
                                Tipo de resíduo:
                            </label>

                            <select id="material" name="material">

                                <option value="" disabled selected>
                                    Selecione o tipo de resíduo...
                                </option>

                                <option value="entulho">
                                    Entulho
                                </option>

                                <option value="moveis">
                                    Móveis
                                </option>

                                <option value="poda de arvore">
                                    Poda de árvore
                                </option>

                                <option value="eletrodomesticos">
                                    Eletrodomésticos
                                </option>

                                <option value="vidro">
                                    Vidro
                                </option>

                                <option value="papel">
                                    Papel
                                </option>

                                <option value="plastico">
                                    Plástico
                                </option>

                                <option value="tampinhas">
                                    Tampinhas
                                </option>

                                <option value="metal">
                                    Metal
                                </option>

                                <option value="pilhas">
                                    Pilhas
                                </option>

                                <option value="baterias">
                                    Baterias
                                </option>

                                <option value="lampadas fluorescentes">
                                    Lâmpadas fluorescentes
                                </option>

                                <option value="remedio vencido">
                                    Remédio vencido
                                </option>

                                <option value="oleo de cozinha">
                                    Óleo de cozinha
                                </option>

                            </select>
                        </div>

                        <div class="campo-busca">
                            <label for="localizacao">
                                Sua localização:
                            </label>
                            <input type="text" id="localizacao" name="localizacao" placeholder="Ex: Cidade ou CEP...">
                        </div>

                        <button type="submit" id="btn-buscar" class="btn-buscar">

                            Buscar

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>

    <section class="mapa-container">

        <h2 class="titulo">
            Pontos Próximos de Você
        </h2>

        <div id="info-endereco" style="
                margin-bottom: 15px;
                font-weight: bold;
                text-align: center;
            ">
        </div>

        <iframe id="iframe-mapa"
            src="https://maps.google.com/maps?q=coleta%20seletiva&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%"
            height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>

    </section>

    <script>

        document
            .getElementById('form-busca')
            .addEventListener('submit', async function (event) {

                // Impede o formulário de recarregar a página
                event.preventDefault();

                const localizacaoInput =
                    document
                        .getElementById('localizacao')
                        .value
                        .trim();

                const materialSelect =
                    document
                        .getElementById('material')
                        .value;

                const iframeMapa =
                    document.getElementById('iframe-mapa');

                const infoEndereco =
                    document.getElementById('info-endereco');

                const botaoBuscar =
                    document.getElementById('btn-buscar');

                if (!localizacaoInput) {
                    alert(
                        'Por favor, informe um CEP ou Cidade.'
                    );
                    return;
                }

                if (!materialSelect) {
                    alert(
                        'Por favor, selecione o tipo de resíduo.'
                    );
                    return;
                }

                botaoBuscar.innerText = 'Buscando...';

                botaoBuscar.disabled = true;

                const cepLimpo =
                    localizacaoInput.replace(/\D/g, '');
                let queryBusca = '';

                if (cepLimpo.length === 8) {

                    infoEndereco.innerText =
                        'Buscando endereço pelo CEP...';
                    try {
                        // Consulta ViaCEP
                        const response = await fetch(
                            `https://viacep.com.br/ws/${cepLimpo}/json/`
                        );
                        // Verifica se a API respondeu corretamente
                        if (!response.ok) {
                            throw new Error(
                                'Erro na resposta da API ViaCEP.'
                            );
                        }

                        // Converte resposta para JSON
                        const data =
                            await response.json();
                        console.log(
                            'Resposta ViaCEP:',
                            data
                        );

                        if (data.erro) {

                            infoEndereco.innerText =
                                'CEP não encontrado. Tentando localizar diretamente no mapa...';
                            queryBusca =
                                `ponto de coleta ${materialSelect} ${localizacaoInput}`;
                        }

                        else {
                            const enderecoFormatado =
                                `${data.logradouro ? data.logradouro + ', ' : ''}` +
                                `${data.bairro ? data.bairro + ', ' : ''}` +
                                `${data.localidade} - ${data.uf}`;
                            infoEndereco.innerText =
                                `Localização encontrada: ${enderecoFormatado}`;

                            queryBusca =
                                `ponto de coleta ${materialSelect} ` +
                                `${data.logradouro || ''} ` +
                                `${data.bairro || ''} ` +
                                `${data.localidade} ` +
                                `${data.uf}`;

                            console.log(
                                'Busca no Google Maps:',
                                queryBusca
                            );
                        }
                    }

                    catch (error) {
                        console.error(
                            'Erro ao buscar CEP:',
                            error
                        );
                        infoEndereco.innerText =
                            'Não foi possível consultar o CEP. Buscando diretamente no mapa...';
                        queryBusca =
                            `ponto de coleta ${materialSelect} ${localizacaoInput}`;
                    }
                }

                else {
                    infoEndereco.innerText =
                        `Buscando pontos de coleta para: ${localizacaoInput}`;
                    queryBusca =
                        `ponto de coleta ${materialSelect} ${localizacaoInput}`;
                }

                console.log(
                    'Pesquisa final:',
                    queryBusca
                );
                const urlMapa =
                    `https://maps.google.com/maps?q=${encodeURIComponent(queryBusca)}` +
                    `&t=&z=14&ie=UTF8&iwloc=&output=embed`;

                iframeMapa.src = urlMapa;
                botaoBuscar.innerText = 'Buscar';
                botaoBuscar.disabled = false;

            });

    </script>

</body>

</html>
